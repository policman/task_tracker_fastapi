[project]
name = "task-tracker-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Gennadiy Samoylov",email = "samoylowfgg@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "pydantic[email] (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "greenlet (>=3.4.0,<4.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "weasyprint (>=68.1,<69.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.7,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.ruff]
# Исключаем папки, которые линтеру читать не нужно
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic",
]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Включаем нужные правила:
# E, W - стандартные ошибки PEP8
# F - ошибки логики (неиспользуемые переменные и т.д.)
# I - isort (сортировка импортов - то, что ты просил)
# B - bugbear (популярные баги)
# UP - pyupgrade (современный синтаксис Python)
select = ["E", "W", "F", "I", "B", "UP"]

# Игнорируем некоторые правила, если они слишком душные
ignore = []

# Настройки специально для isort (сортировки импортов)
[tool.ruff.lint.isort]
known-first-party = ["app"] # Указываем, что папка app - это наш локальный код